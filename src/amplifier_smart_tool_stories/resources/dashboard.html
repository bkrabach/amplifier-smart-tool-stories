<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stories — review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <iframe
      id="material"
      title="Story material"
      sandbox="allow-scripts"
    ></iframe>
    <div id="documentTools" hidden>
      <button id="revealTools" aria-expanded="false" aria-controls="viewTools">
        View &amp; comments
      </button>
      <div id="viewTools" hidden>
        <label
          >View
          <select id="documentMode">
            <option value="continuous">Continuous</option>
            <option value="paginated">Paginated</option>
          </select></label
        >
        <button id="zoomOut" aria-label="Zoom out">−</button
        ><output id="zoomLabel">100%</output
        ><button id="zoomIn" aria-label="Zoom in">+</button
        ><button id="fitWidth">Fit width</button>
        <button id="previousComment" aria-label="Previous comment">‹</button
        ><span id="commentPosition">No comments</span
        ><button id="nextComment" aria-label="Next comment">›</button>
        <button id="documentOverall">Comment</button
        ><button id="documentDetails">Details</button
        ><button id="documentOverlay">Hide review</button
        ><button id="hideTools" aria-label="Hide toolbar">×</button>
      </div>
    </div>
    <header id="bar">
      <span class="brand">Stories</span><span id="title"></span
      ><button id="agent" hidden>Agent highlights</button
      ><button id="overlay">Hide review</button
      ><button id="more">Story details</button>
    </header>
    <div id="hint">Select text or click an element to comment</div>
    <div id="previewNotice">
      Static preview · source scripts and external resources disabled
    </div>
    <footer>
      <button id="previous" aria-label="Previous slide">←</button
      ><span id="position"></span
      ><button id="next" aria-label="Next slide">→</button
      ><button id="overall">Comment on story</button
      ><button id="available" hidden>New revision available</button
      ><span id="connection" role="status"></span>
    </footer>
    <button id="quick" hidden>Comment on selection</button>
    <section id="composer" hidden aria-label="Comment thread">
      <div class="row">
        <strong id="author">Your comment</strong
        ><button id="close" aria-label="Close comment">×</button>
      </div>
      <blockquote id="target"></blockquote>
      <div id="messages" aria-live="polite"></div>
      <label for="comment">Comment</label
      ><textarea
        id="comment"
        rows="3"
        placeholder="Ask a question or suggest a change…"
      ></textarea>
      <div class="row">
        <small id="saved"></small><button id="send">Send</button>
      </div>
      <small id="outcome" role="status"></small>
    </section>
    <aside id="details" hidden>
      <div class="row">
        <h2>Story details</h2>
        <button id="closeDetails">Close</button>
      </div>
      <label for="versions">Reviewing version</label
      ><select id="versions"></select
      ><label for="exportFormat">Export format</label
      ><select id="exportFormat">
        <option value="html">HTML</option>
        <option value="pdf">PDF · Letter pages</option>
        <option value="docx">Word · editable</option>
      </select>
      <p id="exportLimit"></p>
      <button id="export">Export this version</button>
      <h3>Sources & checks</h3>
      <div id="sources"></div>
      <h3>Comments on this version</h3>
      <div id="threads"></div>
    </aside>
    <div id="error" role="alert" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
